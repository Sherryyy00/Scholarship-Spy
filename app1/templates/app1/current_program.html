{% extends "app1/account_base.html" %}
{% block title %}Current programme | Scholarship Spy{% endblock %}
{% block heading %}Current programme{% endblock %}
{% block subheading %}What are you studying at the moment?{% endblock %}

{% block account %}
<form method="post" class="panel" autocomplete="off">
  {% csrf_token %}
  <label class="form-label" for="id_program">Programme</label>
  <input type="text" name="program" id="id_program" class="form-control" maxlength="150"
         placeholder="e.g. MSc Data Science, Teesside University" required>
  <div class="d-flex gap-2 mt-3">
    <button type="submit" class="btn btn-brand">Save</button>
    <a href="{% url 'userprofile' %}" class="btn btn-outline-brand">Cancel</a>
  </div>
</form>
{% endblock %}
