{# Sort dropdown. Keeps current filters (filter_fields) as hidden inputs. #}
<form method="get" class="sort-form">
  {% for k, v in filter_fields.items %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
  <label for="sort" class="visually-hidden">Sort by</label>
  <select name="sort" id="sort" class="form-select form-select-sm" onchange="this.form.submit()">
    {% for value, label in sort_options %}<option value="{{ value }}" {% if value == sort %}selected{% endif %}>{{ label }}</option>{% endfor %}
  </select>
  <noscript><button type="submit" class="btn btn-sm btn-outline-brand">Sort</button></noscript>
</form>
