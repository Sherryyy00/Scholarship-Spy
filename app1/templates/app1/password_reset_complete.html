{% extends "base.html" %}
{% block title %}Password changed | Scholarship Spy{% endblock %}
{% block body %}
<main id="main" class="auth-page">
  <div class="container">
    <div class="auth-card auth-card-single">
      <div class="auth-form">
        <h2>Password changed</h2>
        <p class="text-muted mb-4">Your new password is set. You can log in with it now.</p>
        {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} py-2">{{ message }}</div>
        {% endfor %}
        <a href="{% url 'login' %}" class="btn btn-brand w-100">Log in</a>
      </div>
    </div>
  </div>
</main>
{% endblock %}
